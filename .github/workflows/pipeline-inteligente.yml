name: Pipeline Inteligente

on:
  workflow_dispatch:
  schedule:

    - cron: "0 2 * * *"
  push:
    branches:
      - "feature/*"
    paths:
      - "src/**"
      - "!src/docs/**"

jobs:
  job_gerador:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p saida_build
          echo "Relatório - $(date)" > saida_build/relatorio1.txt
          echo "Cobertura: 85%" > saida_build/relatorio2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build

  job_auditoria:
    runs-on: ubuntu-latest
    needs: job_gerador
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais
      - run: |
          ls -R
          cat relatorio1.txt
